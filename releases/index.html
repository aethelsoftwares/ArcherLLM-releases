<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcherLLM — Release History</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg:           #0d0f14;
            --color-surface:      #13161e;
            --color-border:       #252836;
            --color-accent:       #6c63ff;
            --color-accent-hover: #5b52e5;
            --color-text:         #e8eaf0;
            --color-text-muted:   #7a7f96;
            --font-sans: "Inter", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: var(--font-sans);
            padding: 4rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 650px;
            width: 100%;
        }

        .header {
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-link {
            color: var(--color-text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--color-accent);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Release card component */
        .release-card {
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transition: border-color 0.2s ease;
            position: relative;
        }

        .release-card.latest {
            border-color: rgba(108, 99, 255, 0.4);
        }

        .latest-badge {
            position: absolute;
            top: 1.5rem;
            right: 2rem;
            background-color: var(--color-accent);
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }

        .version {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }

        .date {
            font-size: 0.85rem;
            color: var(--color-text-muted);
            margin-bottom: 1.2rem;
        }

        .notes {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--color-text);
            margin-bottom: 1.5rem;
            white-space: pre-wrap;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            background-color: transparent;
            color: var(--color-text);
            border: 1px solid var(--color-border);
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
            margin-right: 10px;
        }

        .download-btn:hover {
            border-color: var(--color-accent);
            background-color: rgba(108, 99, 255, 0.05);
        }

        #loading {
            text-align: center;
            color: var(--color-text-muted);
            padding: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>All Releases</h1>
            <a href="/" class="back-link">← Back to Home</a>
        </div>

        <div id="loading">Loading releases list...</div>
        <div id="releases-list"></div>
    </div>

    <script>
        const releasesList = document.getElementById('releases-list');
        const loading = document.getElementById('loading');

        fetch('/releases/history.json')
            .then(res => {
                if (!res.ok) throw new Error('Could not load history');
                return res.json();
            })
            .then(data => {
                loading.style.display = 'none';
                if (!data || data.length === 0) {
                    releasesList.innerHTML = '<div style="text-align: center; color: var(--color-text-muted);">No releases found.</div>';
                    return;
                }

                data.forEach((release, index) => {
                    const card = document.createElement('div');
                    card.className = `release-card ${index === 0 ? 'latest' : ''}`;

                    const dateStr = new Date(release.date).toLocaleDateString(undefined, {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });

                    let badgeHTML = '';
                    if (index === 0) {
                        badgeHTML = '<span class="latest-badge">LATEST</span>';
                    }

                    // Build URLs directly based on the structured file name pattern
                    const exeUrl = `/releases/ArcherLLM_${release.version}_x64-setup.exe`;
                    const msiUrl = `/releases/ArcherLLM_${release.version}_x64_en-US.msi`;

                    card.innerHTML = `
                        ${badgeHTML}
                        <div class="version">v${release.version}</div>
                        <div class="date">Released on ${dateStr}</div>
                        <div class="notes">${release.notes}</div>
                        <div class="actions">
                            <a href="${exeUrl}" class="download-btn">Download Windows (EXE)</a>
                            <a href="${msiUrl}" class="download-btn">Download Windows (MSI)</a>
                        </div>
                    `;
                    releasesList.appendChild(card);
                });
            })
            .catch(err => {
                console.error(err);
                loading.innerHTML = '<div style="color: red; text-align: center;">Error loading releases.</div>';
            });
    </script>
</body>
</html>

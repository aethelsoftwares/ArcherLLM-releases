<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcherLLM — Release History</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg-base:      #0d0f14;   /* Near-black background */
            --color-bg-surface:   #13161e;   /* Dark surface */
            --color-border:       #252836;   /* Subtle divider */
            --color-accent:       #6c63ff;   /* Neon purple/blue accent */
            --color-text-primary: #e8eaf0;   /* Primary text */
            --color-text-muted:   #7a7f96;   /* Secondary text */
            --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--color-bg-base);
            color: var(--color-text-primary);
            font-family: var(--font-sans);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .card {
            background: rgba(19, 22, 30, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--color-border);
            padding: 2.5rem;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            color: var(--color-text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s ease;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .back-btn:hover {
            color: var(--color-accent);
        }

        .release-box {
            border-top: 1px solid var(--color-border);
            padding-top: 1.5rem;
            margin-top: 1rem;
        }

        .release-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.5rem;
        }

        .release-version {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--color-accent);
        }

        .release-date {
            font-size: 0.85rem;
            color: var(--color-text-muted);
        }

        .changelog {
            font-size: 0.95rem;
            color: var(--color-text-primary);
            line-height: 1.6;
            white-space: pre-line;
            background: rgba(255, 255, 255, 0.02);
            padding: 1rem;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
    </style>
</head>
<body>
    <div class="card">
        <a href="/" class="back-btn">← Back to Home</a>
        <h1>⚡ Release Changelog</h1>
        
        <div id="release-info" class="release-box">
            <div class="release-header">
                <span id="version-title" class="release-version">v0.0.0</span>
                <span id="release-date" class="release-date">Released: --/--/----</span>
            </div>
            <div id="changelog-content" class="changelog">Loading release information...</div>
        </div>
    </div>

    <script>
      fetch('/releases/latest.json')
        .then(res => {
          if (!res.ok) throw new Error('Not found');
          return res.json();
        })
        .then(data => {
          document.getElementById('version-title').innerText = `Version v${data.version}`;
          document.getElementById('changelog-content').innerText = data.notes || "No release notes available.";
          
          if (data.pub_date) {
            const dateObj = new Date(data.pub_date);
            document.getElementById('release-date').innerText = `Released: ${dateObj.toLocaleDateString()}`;
          }
        })
        .catch(err => {
          console.error(err);
          document.getElementById('version-title').innerText = "v0.0.1";
          document.getElementById('changelog-content').innerText = "Initial Milestone 0.0.1 Release.\n- Skeleton architecture layout setup\n- Windows auto-update validation logic wired.";
          document.getElementById('release-date').innerText = "Released: July 14, 2026";
        });
    </script>
</body>
</html>

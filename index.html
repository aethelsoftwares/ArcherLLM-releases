<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcherLLM — Secure Desktop AI Client</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg:           #0d0f14;
            --color-surface:      #13161e;
            --color-border:       #252836;
            --color-accent:       #6c63ff;
            --color-accent-hover: #5b52e5;
            --color-text:         #e8eaf0;
            --color-text-muted:   #7a7f96;
            --font-sans: "Inter", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: var(--font-sans);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
        }

        p.description {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--color-text-muted);
            margin-bottom: 2.5rem;
        }

        .btn {
            display: inline-block;
            background-color: var(--color-accent);
            color: #ffffff;
            text-decoration: none;
            padding: 0.9rem 2.2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.2s ease;
            box-shadow: 0 4px 12px rgba(108, 99, 255, 0.25);
        }

        .btn:hover {
            background-color: var(--color-accent-hover);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">⚡</div>
        <h1>ArcherLLM</h1>
        <p class="description">
            ArcherLLM is a secure, high-performance desktop chat interface built for local AI workflows. 
            Enjoy absolute privacy, customization, and a sleek desktop experience with zero cloud dependencies.
        </p>
        <a href="/releases" class="btn">See Latest Releases</a>
    </div>
</body>
</html>
